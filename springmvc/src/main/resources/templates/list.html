<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${appName}">Gestión de Productos</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 2rem; }
		table { border-collapse: collapse; width: 100%; }
		th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
		th { background: #f0f0f0; }
		.btn { padding: 0.3rem 0.8rem; margin-right: 0.3rem; text-decoration: none;
		       border: 1px solid #888; border-radius: 4px; background: #eee; }
		.btn:hover { background: #ddd; }
	</style>
</head>
<body>
	<h1 th:text="${appName}">Gestión de Productos</h1>

	<!-- Mensaje de error si viene de la vista de error -->
	<div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>

	<p>Total de productos: <span th:text="${totalProducts}">0</span></p>

	<a class="btn" th:href="@{/products/new}">Nuevo producto</a>

	<table>
		<thead>
			<tr>
				<th>ID</th>
				<th>Nombre</th>
				<th>Precio</th>
				<th>Descripción</th>
				<th>Acciones</th>
			</tr>
		</thead>
		<tbody>
			<!-- Si no hay productos mostramos una fila informativa -->
			<tr th:if="${#lists.isEmpty(products)}">
				<td colspan="5">No hay productos disponibles</td>
			</tr>
			<tr th:each="p : ${products}">
				<td th:text="${p.id}">1</td>
				<td th:text="${p.name}">Nombre</td>
				<td th:text="${#numbers.formatDecimal(p.price, 1, 2)} + ' €'">10.00 €</td>
				<td th:text="${p.description}">Descripción</td>
				<td>
					<a class="btn" th:href="@{/products/details/{id}(id=${p.id})}">Ver</a>
					<a class="btn" th:href="@{/products/edit/{id}(id=${p.id})}">Editar</a>
					<!-- Borrado vía formulario POST con confirmación -->
					<form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline"
					      onsubmit="return confirm('¿Eliminar este producto?');">
						<button class="btn" type="submit">Eliminar</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
